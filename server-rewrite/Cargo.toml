[package]
name = "hamlet"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14"
sea-orm = { version = "=2.0.3", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio", "with-chrono"] }
sea-orm-migration = { version = "=2.0.3", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
hamlet-migration = { path = "migration" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
utoipa = { version = "5", default-features = false, features = ["chrono", "macros"] }
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
